<section class="hero">
  <!-- Animated Background Elements -->
  <div class="bg-animation">
    <div class="floating-shape shape-1"></div>
    <div class="floating-shape shape-2"></div>
    <div class="floating-shape shape-3"></div>
    <div class="grid-overlay"></div>
  </div>

  <div class="hero-container">

    <!-- LEFT : Profile Image -->
    <div class="hero-image">
      <div class="image-frame">
        <div class="rotating-border"></div>
        <div class="image-wrapper">
          <img src="assets/Pic.jpg" alt="Praveen Raj" />

        <div class="glow-effect"></div>

    </div>

    <!-- RIGHT : Content -->

      <!-- Greeting with Typing Effect -->
      <div class="greeting">
        <span class="hello-badge">👋 Hello, I'm</span>
        <h1>
          <span class="name-primary">Praveen Raj</span>
          <span class="name-underline"></span>
        </h1>
      </div>

      <!-- Animated Title -->
      <h2 class="role-title">
        <span class="role-label">I'm a</span>
        <span class="role-animated">
          <span class="role-text">Software Developer</span>
          <span class="role-text">Java Developer</span>
          <span class="role-text">Problem Solver</span>
        </span>
      </h2>

      <!-- Description with Icon -->

        <svg class="quote-icon" width="24" height="24" viewBox="0 0 24 24" fill="none">
          <path d="M3 21c3 0 7-1 7-8V5c0-1.25-.756-2.017-2-2H4c-1.25 0-2 .75-2 1.972V11c0 1.25.75 2 2 2 1 0 1 0 1 1v1c0 1-1 2-2 2s-1 .008-1 1.031V20c0 1 0 1 1 1z" fill="currentColor" opacity="0.2"/>

        </svg>
        I build <strong>clean</strong>, <strong>scalable</strong>, and <strong>user-friendly</strong> web applications that solve real-world problems with elegant code.
      </p>

      <!-- Enhanced Action Buttons -->
      <div class="actions">
        <a routerLink="/about" class="btn btn-about">

            <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">

              <circle cx="12" cy="7" r="4" stroke="currentColor" stroke-width="2"/>

            <span>About Me</span>
          </span>

        <a routerLink="/projects" class="btn btn-projects">

              <rect x="14" y="3" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
              <rect x="14" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>
              <rect x="3" y="14" width="7" height="7" rx="1" stroke="currentColor" stroke-width="2"/>

            <path d="M4 10h12m0 0l-4-4m4 4l-4 4" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <span class="btn-shine"></span>
        </a>

        <a routerLink="/contact" class="btn btn-contact">

            <svg class="btn-icon" width="20" height="20" viewBox="0 0 24 24" fill="none">

              <polyline points="22,6 12,13 2,6" stroke="currentColor" stroke-width="2"/>
            </svg>
            <span>Contact Me</span>
          </span>
          <span class="btn-glow"></span>
        </a>
